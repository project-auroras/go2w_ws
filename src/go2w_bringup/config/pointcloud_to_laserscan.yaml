pointcloud_to_laserscan:
  ros__parameters:
    target_frame: base_link
    transform_tolerance: 0.05
    # Slice of the cloud (in base_link) turned into /scan
    min_height: -0.20
    max_height: 0.30
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.15
    range_max: 15.0
    use_inf: true
