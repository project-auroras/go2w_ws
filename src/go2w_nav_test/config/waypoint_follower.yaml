waypoint_follower:
  ros__parameters:
    # x0, y0, x1, y1, ... in meters, relative to the pose when the node starts
    # (x forward, y left). 1 m square to the left, back to the start.
    waypoints: [1.0, 0.0, 1.0, 1.0, 0.0, 1.0, 0.0, 0.0]
    loop: false

    # Low speeds for the first tests (the driver also clamps with max_vx / max_wz)
    max_linear: 0.3
    max_angular: 0.5
    k_linear: 0.5
    k_angular: 1.5
    goal_tolerance: 0.10
    heading_tolerance: 0.3

    # Stop while /scan has something closer than stop_distance in +-obstacle_half_angle rad
    use_scan: false
    stop_distance: 0.5
    obstacle_half_angle: 0.5

    # Stop if /odom (or /scan) is older than this
    data_timeout: 0.5
    control_rate: 20.0
