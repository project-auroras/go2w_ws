# yolo_ros con el modelo propio de navegación semántica (47 clases: Row, Trace, Trunk, Post,
# Pothole, Puddle, person, animales, frutas...) y la cámara simulada de go2w_gis.launch.py.
# El modelo no está en git (82 MB): copiarlo a models/ del repo (/ws/models en el contenedor).
# Se exportó sin NMS (end2end=False): yolo_ros lo aplica con `iou`. Las clases las lee de
# los metadatos del ONNX.
/yolo/yolo_node:
  ros__parameters:
    use_sim_time: true
    plugins: ["detection", "tracking", "detection3d", "debug"]
    cameras: ["cam0"]
    cam0:
      rgb_topic: /camera/camera/color/image_raw
      depth_topic: /camera/camera/aligned_depth_to_color/image_raw
      depth_info_topic: /camera/camera/color/camera_info
      image_reliability: 1
      depth_reliability: 1
    detection:
      plugin: yolo_ros/DetectionPlugin
      model_path: /ws/models/yolo26m_datasetFinal.onnx
      threshold: 0.35
      iou: 0.45
      n_threads: -1
      img_width: 640
      img_height: 480
      provider: cuda
      cameras: ["cam0"]
    tracking:
      plugin: yolo_ros/TrackingPlugin
      cameras: ["cam0"]
      tracker_type: bytetrack
      track_high_thresh: 0.25
      track_low_thresh: 0.1
      new_track_thresh: 0.25
      track_buffer: 30
      match_thresh: 0.8
      fuse_score: true
    detection3d:
      plugin: yolo_ros/Detect3DPlugin
      cameras: ["cam0"]
      target_frame: base_link
    debug:
      plugin: yolo_ros/DebugPlugin
      cameras: ["cam0"]
      marker_lifetime: 0.5
