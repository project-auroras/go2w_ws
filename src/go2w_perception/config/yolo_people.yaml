# yolo_ros para detectar personas con la RealSense del Go2-W (people.launch.py): YOLO26s
# (Hugging Face) + ByteTrack + 3D con la profundidad alineada al color. Basado en
# yolo_bringup/config/yolo.yaml. La clave del bloque tiene que coincidir con el namespace
# del launch ("yolo"). Con la cámara real, las posiciones 3D salen en base_link (la TF
# base_link -> camera_link está en el URDF, con la inclinación de 20 deg): x delante,
# y izquierda, z arriba. Con source:=bag salen en el frame óptico (esos bags no tienen TF).
/yolo/yolo_node:
  ros__parameters:
    plugins: ["detection", "tracking", "detection3d", "debug"]
    cameras: ["cam0"]
    cam0:
      # rgb_topic, depth_topic, depth_info_topic y detection3d.target_frame los fija el
      # launch según source:=camera|wifi|bag (go2w_perception/camera_source.py).
      # Aquí quedan los de source:=camera.
      rgb_topic: /camera/camera/color/image_raw
      depth_topic: /camera/camera/aligned_depth_to_color/image_raw
      depth_info_topic: /camera/camera/aligned_depth_to_color/camera_info
      image_reliability: 1
      depth_reliability: 1
    detection:
      plugin: yolo_ros/DetectionPlugin
      model_repo: unileon-robotics/YOLO26-ONNX
      model_filename: yolo26s.onnx
      # en /ws (el repo montado) para que el modelo no se pierda al cerrar el contenedor (--rm)
      cache_dir: /ws/models/huggingface
      threshold: 0.5
      iou: 0.45
      n_threads: -1
      img_width: 640
      img_height: 480
      provider: cuda
      cameras: ["cam0"]
    tracking:
      plugin: yolo_ros/TrackingPlugin
      cameras: ["cam0"]
      tracker_type: bytetrack
      track_high_thresh: 0.25
      track_low_thresh: 0.1
      new_track_thresh: 0.25
      track_buffer: 30
      match_thresh: 0.8
      fuse_score: true
    detection3d:
      plugin: yolo_ros/Detect3DPlugin
      cameras: ["cam0"]
      target_frame: base_link
    debug:
      plugin: yolo_ros/DebugPlugin
      cameras: ["cam0"]
      marker_lifetime: 0.5
