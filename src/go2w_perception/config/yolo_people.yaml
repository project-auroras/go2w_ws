# yolo_ros pipeline for the RealSense on the Go2-W: YOLO26 detection +
# ByteTrack + 3D from the depth aligned to color. Based on
# yolo_bringup/config/yolo.yaml. The block key must match the launch
# namespace ("yolo").
/yolo/yolo_node:
  ros__parameters:
    plugins: ["detection", "tracking", "detection3d", "debug"]
    cameras: ["cam0"]
    cam0:
      rgb_topic: /camera/camera/color/image_raw
      depth_topic: /camera/camera/aligned_depth/image
      depth_info_topic: /camera/camera/aligned_depth/camera_info
      image_reliability: 1
      depth_reliability: 1
    detection:
      plugin: yolo_ros/DetectionPlugin
      model_repo: unileon-robotics/YOLO26-ONNX
      model_filename: yolo26s.onnx
      threshold: 0.5
      iou: 0.45
      n_threads: -1
      img_width: 640
      img_height: 480
      provider: cuda
      cameras: ["cam0"]
    tracking:
      plugin: yolo_ros/TrackingPlugin
      cameras: ["cam0"]
      tracker_type: bytetrack
      track_high_thresh: 0.25
      track_low_thresh: 0.1
      new_track_thresh: 0.25
      track_buffer: 30
      match_thresh: 0.8
      fuse_score: true
    detection3d:
      plugin: yolo_ros/Detect3DPlugin
      cameras: ["cam0"]
      target_frame: camera_color_optical_frame   # the bags have no TF to base_link
    debug:
      plugin: yolo_ros/DebugPlugin
      cameras: ["cam0"]
      marker_lifetime: 0.5
