# person_follower: /people -> /cmd_vel (go2w_driver recorta a max_vx / max_wz)
person_follower:
  ros__parameters:
    input_topic: /people
    cmd_vel_topic: /cmd_vel
    odom_topic: /odom           # velocidad de la persona respecto al suelo (con la del robot)
    target_id: ""               # "" = la persona más cercana; luego se queda con su ID
    target_distance: 1.5        # m a los que se queda de la persona (parada)
    time_gap: 0.5               # s: con la persona andando a v, se queda a target_distance + time_gap * v
    distance_deadband: 0.15     # m, no avanza si está a menos de target_distance + esto
    max_range: 8.0              # m, ignora detecciones más lejanas
    k_linear: 1.0               # m/s por cada m de más (se suma a la velocidad de la persona)
    k_angular: 1.5
    max_linear: 1.6             # m/s hacia delante (go2w_driver limita a max_vx; people_live.launch.py baja a 0.6)
    max_accel: 1.0              # m/s^2 al ganar velocidad
    max_decel: 1.5              # m/s^2 al frenar (frena antes de lo que acelera)
    backoff_distance: 1.3       # m desde base_link (~1 m desde el morro): más cerca -> marcha atrás
    k_backoff: 1.0
    max_backward: 0.3           # m/s hacia atrás (detrás no hay cámara: despacio)
    max_angular: 1.2            # rad/s (go2w_driver limita a max_wz 1.5)
    k_angular_ff: 1.0           # anticipa el giro con la velocidad lateral de la persona (0 = no)
    # pasa cada detección a odom con la pose del robot cuando se tomó la imagen (stamp de /people),
    # no con la de ahora: si gira mientras llega la detección (WiFi + YOLO), no la descoloca
    latency_compensation: true
    max_angular_accel: 3.0      # rad/s^2
    turn_in_place_angle: 0.6    # rad (~34 deg), con más desvío gira sin avanzar (si la persona está parada)
    moving_speed: 0.2           # m/s: por encima, la persona "anda" y el robot no se para a girar
    # filtro alfa-beta de la posición de la persona en odom (más alto = reacciona antes, más ruido)
    track_alpha: 0.35
    track_beta: 0.05
    max_person_speed: 3.0       # m/s, tope de la velocidad estimada
    stop_timeout: 0.5           # s sin verla -> se para (pero la recuerda)
    lost_timeout: 3.0           # s sin verla -> la olvida y elige otra persona
    reacquire_radius: 1.0       # m: si el tracker le cambia el ID, se engancha a la
                                # detección que aparezca a menos de esto de donde estaba
    max_start_distance: 3.0     # m: al empezar solo elige personas a menos de esto
    # Búsqueda: si la pierde, gira sobre sí mismo hacia el lado por el que se fue
    search_enabled: true
    search_delay: 1.5           # s sin verla -> empieza a girar (a los stop_timeout ya ha frenado)
    search_angular: 0.6         # rad/s (una vuelta en ~10 s)
    search_timeout: 20.0        # s girando sin encontrar a nadie -> se para
    search_max_distance: 5.0    # m: buscando (ya olvidada) acepta a la persona más cercana a menos de esto
    # Obstáculos con /scan (LiDAR, en base_link). Sin /scan reciente no se desplaza.
    obstacle_avoidance: true
    scan_topic: /scan
    scan_timeout: 0.5           # s
    # caja del robot desde base_link (como self_box de go2w_bringup/config/lio_scan.yaml)
    robot_front: 0.45
    robot_back: -0.55
    robot_half_width: 0.35
    side_margin: 0.20           # m de más a cada lado en el pasillo de frenada
    stop_distance: 0.4          # m: siempre puede frenar antes de esto del obstáculo
    obstacle_decel: 1.0         # m/s^2 con los que calcula la frenada
    obstacle_latency: 0.3       # s de retraso del scan (lio_scan junta 1 s de nubes)
    avoid_distance: 0.5         # m: obstáculos más cerca a los lados -> se aparta
    k_avoid: 1.0                # rad/s de giro para apartarse (máximo)
    person_clearance: 0.4       # m alrededor de la persona seguida que no son obstáculo
    person_trail_time: 1.5      # s de recorrido de la persona que no son obstáculo (estela del scan)
    rate: 10.0

# fake_person: personas virtuales para probar sin cámara (person_follower_sim.launch.py)
fake_person:
  ros__parameters:
    world_frame: odom
    camera_frame: camera_color_optical_frame
    output_topic: /people
    rate: 15.0
    hfov_deg: 69.0              # RealSense D435 color
    min_range: 0.3
    max_range: 6.0
    noise: 0.03                 # sigma = 3 % de la distancia
    dropout: 0.1                # 10 % de frames sin detección
    person_height: 1.7
    speed: 0.4                  # m/s de la persona 1
    speed_profile: [0.0]        # m/s de cada tramo de path (p. ej. [0.5, 1.4, 0.8]); [0.0] = speed
    pause: 2.0                  # s parada en cada punto
    latency: 0.0                # s de retraso de /people (stamp = cuando se tomó la imagen), como WiFi + YOLO
    new_id_on_reappear: true    # nuevo ID al volver a entrar en la imagen (como ByteTrack)
    # /scan simulado para la evitación de obstáculos de person_follower: ve los obstáculos
    # y a las personas con su estela de scan_window s (como lio_scan en el robot)
    publish_scan: true
    scan_window: 1.0
    obstacles: [0.0]            # columnas [x, y, radio, ...] en odom; [0.0] = ninguna. Tapan a las personas
    # recorrido en bucle de la persona 1, x0 y0 x1 y1 ... (el robot empieza en 0 0 mirando a +x)
    path: [3.0, 0.0, 7.0, 0.0, 7.0, 4.0, 2.0, 4.0, 2.0, 1.0]
    # persona 2 (distracción): [] para quitarla
    distractor_path: [6.0, -3.0, 6.0, -1.5]
