# slam_toolbox online_async for the Go2-W (/scan from pointcloud_to_laserscan, /odom from FAST-LIO).
# Parameters left out keep slam_toolbox's defaults.
# Run with: ros2 launch slam_toolbox online_async_launch.py slam_params_file:=<ws>/config/slam_toolbox.yaml
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    resolution: 0.05
    # pointcloud_to_laserscan.yaml: range_min 0.15, range_max 15.0
    min_laser_range: 0.2
    max_laser_range: 15.0
    # Defaults are 5 s and 0.5 m / 0.5 rad: with short indoor runs the map barely changed
    map_update_interval: 1.0
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
